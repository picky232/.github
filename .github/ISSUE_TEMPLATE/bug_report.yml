name: 🐛 버그 리포트
description: 발견한 버그를 신고합니다
title: "[BUG]: "
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: 중복 확인
      options:
        - label: 동일한 이슈가 이미 등록되어 있지 않은지 확인했습니다
          required: true
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - 기타
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 브라우저/버전
      placeholder: ex. Chrome 128
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 로그/스크린샷
      render: shell
